[package]
name = "navi"
version = "1.2.0"
edition = "2021"

[dependencies]
navi-core = { path = "../navi-core" }
egui = { version = "0.29", features = ["default_fonts", "bytemuck"] }
egui_extras = { version = "0.29", features = ["image"] }
# x11/wayland features are inert on macOS/Windows (their deps are target-gated
# in each crate) but are what give Linux builds both backends; wayland-dlopen
# keeps libwayland out of the link so one binary runs on X11-only hosts too.
egui-winit = { version = "0.29", default-features = false, features = ["clipboard", "links", "x11", "wayland"] }
egui_glow = { version = "0.29", default-features = false, features = ["winit"] }
glow = "0.14"
glutin = "0.32"
glutin-winit = "0.5"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
raw-window-handle = "0.6"
regex = "1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Taskbar/titlebar icon on Windows + X11 (macOS reads the bundle's .icns).
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
# AttachConsole: re-attach stderr when a windows-subsystem build is launched
# from a terminal, so NAVI_FPS_LOG & friends still print. MessageBoxW: panic
# dialog, since a GUI-subsystem process otherwise dies invisibly.
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSRunLoop", "NSString", "NSObjCRuntime", "NSThread", "NSDate"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSScreen", "NSApplication", "NSRunningApplication", "NSResponder"] }
objc2-quartz-core = { version = "0.3", features = ["CADisplayLink", "CAFrameRateRange"] }

